[project]
name = "metalab-suite"
version = "0.1.0"
description = "An educational suite of trajectory-based metaheuristic problems with simulators, baselines and interactive GUIs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Joaquin Mateos" }]
keywords = [
    "metaheuristics",
    "trajectory-based",
    "optimization",
    "simulation",
    "operations-research",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]

# ---------------------------------------------------------------------------
# Shared runtime dependencies.
#
# The suite is intentionally built on one virtual environment managed by uv.
# Every problem folder (`wind_farm_layout_optimization/`,
# `dynamic_drone_routing/`, ...) shares these dependencies:
#   * mathematical evaluation ....... numpy, scipy, pandas, networkx
#   * discrete-event simulation ..... simpy
#   * visualization & local GUIs .... matplotlib, plotly, streamlit
#   * quality of life ............... tqdm
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "networkx>=3.3",
    "simpy>=4.1",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "streamlit>=1.36",
    "tqdm>=4.66",
]

# ---------------------------------------------------------------------------
# Shared development dependencies (installed by `uv sync`, or
# `uv sync --group dev` to be explicit). They are part of uv's `dev` group.
# uv's dependency groups are the modern replacement for optional-dependencies.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

# ---------------------------------------------------------------------------
# Build backend: installs the shared `metalab` helper package from src/.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metalab"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.uv]
# The suite is a single uv project: one lockfile, one environment, many problems.
# Each problem lives in its own top-level folder and is run with `uv run`.
package = true
